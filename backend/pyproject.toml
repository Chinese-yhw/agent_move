[project]
name = "drama-gen-backend"
version = "0.1.0"
description = "AI 短剧生成平台后端（FastAPI + Celery + ComfyUI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "openai>=1.40",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "websockets>=12.0",
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]
