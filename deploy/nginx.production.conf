# ==========================================
# Drama Gen 裸机部署 Nginx 配置（Ubuntu/Debian）
# proxy_pass 到本地 uvicorn:8000（不是 Docker backend:8000）
# 使用方式：sudo cp nginx.production.conf /etc/nginx/sites-available/drama-gen.conf
#          sudo ln -s /etc/nginx/sites-available/drama-gen.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# ==========================================

server {
    listen 80;
    server_name _;   # 生产换你的域名：yourdomain.com

    # 用户上传的视频素材可能很大
    client_max_body_size 500m;

    # 后端超时（视频生成/合成/配音都可能等待较久）
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # 前端静态文件位置
    root /var/www/drama-gen;
    index index.html;

    # SPA 路由回退（React Router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件（TTS 音频 + 视频输出 + 字幕）
    # 走后端的 StaticFiles mount，同样反代到 uvicorn
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Nginx 自身健康检查
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 关闭 favicon 的 404 噪音
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}

# ==========================================
# 如果有多个进程可以上 upstream，但单进程足够用
# upstream drama_backend {
#     server 127.0.0.1:8000;
# }
# ==========================================
